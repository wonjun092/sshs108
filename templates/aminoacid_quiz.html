<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아미노산 암기 프로그램</title>
<style>
  :root{--bg:#f5f5f0;--card:#fff;--border:#e0deda;--border2:#c8c5c0;--text:#1a1a18;--text2:#666660;--text3:#999993;--gbg:#eaf3de;--gt:#3B6D11;--gb:#97c459;--rbg:#fcebeb;--rt:#A32D2D;--rb:#f09595;--rad:10px;--rads:7px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .app{max-width:700px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:20px;font-weight:600;margin-bottom:20px}
  .settings{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:18px;margin-bottom:16px}
  .stitle{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:12px;letter-spacing:.06em;text-transform:uppercase}
  .srow{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
  .srow:last-child{margin-bottom:0}
  .slabel{font-size:13px;color:var(--text2);min-width:72px;padding-top:5px;flex-shrink:0}
  .pills{display:flex;flex-wrap:wrap;gap:5px}
  .pill{padding:4px 12px;font-size:12px;border:1px solid var(--border2);border-radius:20px;background:var(--card);color:var(--text2);cursor:pointer;transition:all .12s;white-space:nowrap}
  .pill:hover{background:var(--bg)}.pill.on{background:var(--text);color:#fff;border-color:var(--text)}
  .divider{height:1px;background:var(--border);margin:14px 0}
  .rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:6px}
  .ri{padding:8px 10px;border:1px solid var(--border2);border-radius:var(--rads);background:var(--card);color:var(--text2);cursor:pointer;transition:all .12s;text-align:left}
  .ri:hover{background:var(--bg)}.ri.on{background:var(--text);color:#fff;border-color:var(--text)}
  .ri .rt{font-weight:600;font-size:13px;display:block}.ri .rs{font-size:11px;opacity:.65;display:block;margin-top:2px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--rads);padding:10px 8px;text-align:center}
  .stat .num{font-size:22px;font-weight:600;display:block}.stat .lbl{font-size:11px;color:var(--text3);margin-top:2px;display:block}
  .stat.streak .num{color:#854F0B}
  .pw{background:var(--border);border-radius:3px;height:5px;margin-bottom:20px;overflow:hidden}
  .pf{height:100%;background:var(--text);border-radius:3px;transition:width .3s}
  .q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:20px 20px 16px;text-align:center;margin-bottom:16px}
  .qlabel{font-size:11px;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px}
  .qbig{font-size:52px;font-weight:600;line-height:1;margin-bottom:4px}.qbig.md{font-size:28px;margin-top:6px}
  .qsub{font-size:13px;color:var(--text2);margin-bottom:6px}
  .ctag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;margin-top:4px}
  .svgwrap{display:flex;justify-content:center;padding:8px 0 4px}
  .input-area{margin-bottom:10px}
  .input-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .input-row label{font-size:13px;color:var(--text2);min-width:52px}
  input[type=text]{flex:1;height:44px;padding:0 14px;font-size:15px;border:1px solid var(--border2);border-radius:var(--rads);background:var(--card);color:var(--text);outline:none;transition:border-color .15s}
  input:focus{border-color:#888}input.ok{border-color:var(--gb);background:var(--gbg)}input.ng{border-color:var(--rb);background:var(--rbg)}
  .hint{font-size:11px;color:var(--text3);text-align:center;margin-bottom:8px}
  .brow{display:flex;gap:8px;margin-bottom:10px}
  .btn{flex:1;height:44px;border:1px solid var(--border2);border-radius:var(--rads);background:var(--card);color:var(--text);font-size:14px;cursor:pointer;transition:background .12s}
  .btn:hover:not(:disabled){background:var(--bg)}.btn:disabled{opacity:.4;cursor:default}
  .btn.pri{background:var(--text);color:#fff;border-color:var(--text)}.btn.pri:hover:not(:disabled){opacity:.85}
  .fb{min-height:22px;text-align:center;font-size:13px;margin-bottom:8px;color:var(--text3)}
  .fb.ok{color:var(--gt);font-weight:600}.fb.ng{color:var(--rt);font-weight:500}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .opt{border:1px solid var(--border2);border-radius:var(--rads);padding:10px 12px;font-size:13px;cursor:pointer;background:var(--card);color:var(--text);text-align:left;line-height:1.5;transition:background .1s}
  .opt:hover:not(:disabled){background:var(--bg)}.opt.ok{background:var(--gbg);border-color:var(--gb);color:var(--gt);font-weight:500}
  .opt.ng{background:var(--rbg);border-color:var(--rb);color:var(--rt)}.opt:disabled{cursor:default}
  .result{text-align:center;padding:32px 16px}.result .score{font-size:56px;font-weight:600}
  .result .grade{font-size:18px;color:var(--text2);margin:8px 0 24px}
  .rbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.rbtns .btn{flex:none;padding:0 24px}
  .wsec{margin-top:24px;border-top:1px solid var(--border);padding-top:16px;text-align:left}
  .wsec h3{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text2)}
  .wtbl{width:100%;border-collapse:collapse;font-size:13px}
  .wtbl th{text-align:left;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:500;border-bottom:1px solid var(--border)}
  .wtbl td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}.wtbl tr:last-child td{border-bottom:none}
  .rinfo{background:var(--bg);border:1px solid var(--border);border-radius:var(--rads);padding:10px 14px;margin-bottom:10px;font-size:13px;line-height:1.7;text-align:left}
</style>
</head>
<body>
<div class="app">
<h1>아미노산 암기</h1>
<div class="settings">
  <div class="stitle">출제 모드</div>
  <div class="srow">
    <span class="slabel">문제 방향</span>
    <div class="pills">
      <button class="pill on" id="m-s2n" onclick="setMode('s2n')">구조식 → 이름</button>
      <button class="pill"    id="m-s2a" onclick="setMode('s2a')">구조식 → 약자</button>
      <button class="pill"    id="m-n2a" onclick="setMode('n2a')">이름 → 약자</button>
      <button class="pill"    id="m-a2n" onclick="setMode('a2n')">약자 → 이름</button>
      <button class="pill"    id="m-n2p" onclick="setMode('n2p')">이름 → R기 특성</button>
      <button class="pill"    id="m-s2p" onclick="setMode('s2p')">구조식 → R기 특성</button>
      <button class="pill"    id="m-mix" onclick="setMode('mix')">전체 혼합</button>
    </div>
  </div>
  <div class="srow">
    <span class="slabel">입력 방식</span>
    <div class="pills">
      <button class="pill on" id="t-type" onclick="setInput('type')">직접 입력</button>
      <button class="pill"    id="t-mc"   onclick="setInput('mc')">4지선다</button>
    </div>
  </div>
  <div class="srow">
    <span class="slabel">출제 순서</span>
    <div class="pills">
      <button class="pill on" id="t-rand" onclick="setOrder('random')">랜덤</button>
      <button class="pill"    id="t-seq"  onclick="setOrder('seq')">순서대로</button>
    </div>
  </div>
  <div class="divider"></div>
  <div class="stitle">문제 범위</div>
  <div class="rg">
    <button class="ri on" data-range="all"       onclick="setRange(this)"><span class="rt">전체</span><span class="rs">20개 표준 아미노산</span></button>
    <button class="ri"    data-range="nonpolar"  onclick="setRange(this)"><span class="rt">비극성 R기</span><span class="rs">Gly Ala Val Leu Ile Pro Phe Trp Met</span></button>
    <button class="ri"    data-range="polar"     onclick="setRange(this)"><span class="rt">극성 R기</span><span class="rs">Ser Thr Cys Tyr Asn Gln</span></button>
    <button class="ri"    data-range="positive"  onclick="setRange(this)"><span class="rt">양전하 R기</span><span class="rs">Lys Arg His</span></button>
    <button class="ri"    data-range="negative"  onclick="setRange(this)"><span class="rt">음전하 R기</span><span class="rs">Asp Glu</span></button>
    <button class="ri"    data-range="charged"   onclick="setRange(this)"><span class="rt">하전 R기</span><span class="rs">양전하+음전하 5개</span></button>
    <button class="ri"    data-range="aromatic"  onclick="setRange(this)"><span class="rt">방향족</span><span class="rs">Phe Tyr Trp His</span></button>
    <button class="ri"    data-range="essential" onclick="setRange(this)"><span class="rt">필수 아미노산</span><span class="rs">Val Leu Ile Met Phe Trp Thr Lys</span></button>
    <button class="ri"    data-range="sulfur"    onclick="setRange(this)"><span class="rt">황 함유</span><span class="rs">Cys Met</span></button>
    <button class="ri"    data-range="wrong"     onclick="setRange(this)"><span class="rt">틀린 것만</span><span class="rs">오답 복습</span></button>
  </div>
</div>
<div class="stats">
  <div class="stat"><span class="num" id="s-cor">0</span><span class="lbl">정답</span></div>
  <div class="stat"><span class="num" id="s-wrn">0</span><span class="lbl">오답</span></div>
  <div class="stat"><span class="num" id="s-prog">0</span><span class="lbl">진행</span></div>
  <div class="stat streak"><span class="num" id="s-streak">0</span><span class="lbl">연속정답</span></div>
</div>
<div class="pw"><div class="pf" id="pbar" style="width:0%"></div></div>
<div id="qa"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  SVG STRUCTURE ENGINE
//  α-carbon (Ca) is the CROSS CENTER of every structure.
//  4 bonds radiate from Ca:
//    UP    → COO⁻
//    LEFT  → H₃N⁺
//    RIGHT → H
//    DOWN  → R group (highlighted in blue box)
//  All bonds are explicit <line> elements — no "—" text.
// ═══════════════════════════════════════════════════════════

const RB = '#cce8f4'; // R-group box fill
const SW = 1.7;       // stroke-width
const FSZ = 14;       // default font-size
const FF = "font-family=\"'Helvetica Neue',Arial,sans-serif\" font-size=\"14\"";

// Row spacing: distance from Ca to adjacent atom center
const RS = 30;
// Line gap: stop this many px before text center (half text height)
const G = 9;

// Primitives
const T = (x,y,txt,fs=FSZ,fill='#222') =>
  `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="${fs}" fill="${fill}">${txt}</text>`;

const VL = (x,y1,y2) =>
  `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#333" stroke-width="${SW}"/>`;

const HL = (x1,x2,y,dbl=false) => {
  let s = `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#333" stroke-width="${SW}"/>`;
  if(dbl) s += `<line x1="${x1}" y1="${y+3}" x2="${x2}" y2="${y+3}" stroke="#333" stroke-width="${SW}"/>`;
  return s;
};

// backbone: draws COO⁻/C/H₃N⁺/H cross with Ca at (cx,cy)
// returns bond lines + atom labels (no R bond — caller adds that)
function BB(cx, cy) {
  // text label widths (approximate half-width for gap calc)
  const cooW = 20, nh3W = 20, hW = 5;
  return [
    T(cx, cy-RS, 'COO⁻'),
    VL(cx, cy-RS+G+2, cy-G),          // up bond
    T(cx, cy, 'C'),
    T(cx-RS*1.9, cy, 'H₃N⁺', 13),
    HL(cx-RS*1.9+nh3W, cx-G, cy),     // left bond
    T(cx+RS, cy, 'H', 13),
    HL(cx+G, cx+RS-hW, cy),            // right bond
  ].join('');
}

// R-group highlight box: auto-sized
function RBox(cx, cy, rH, rW) {
  const hw = rW/2;
  return `<rect x="${cx-hw}" y="${cy-10}" width="${rW}" height="${rH+14}" rx="4" fill="${RB}"/>`;
}

// ── Ring builders ──────────────────────────────────────────

// Benzene: top bond entry at (cx, ty), ring drawn below
function Benzene(cx, ty) {
  const r = 24;
  const pts = [];
  for(let i=0;i<6;i++){
    const a = -Math.PI/2 + i*Math.PI/3;
    pts.push([cx+r*Math.cos(a), ty+r+r*Math.sin(a)]);
  }
  const poly = pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<polygon points="${poly}" fill="none" stroke="#333" stroke-width="${SW}"/>
    <circle cx="${cx}" cy="${(ty+r).toFixed(1)}" r="${(r*0.56).toFixed(1)}" fill="none" stroke="#333" stroke-width="1.1" stroke-dasharray="3,2"/>`;
}

// Indole (Trp): entry at top (cx,ty)
function Indole(cx, ty) {
  const r5=20, r6=22;
  const c5x=cx-16, c5y=ty+r5+6;
  const c6x=cx+24, c6y=ty+r6+6;
  const pts5=[]; for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;pts5.push([c5x+r5*Math.cos(a),c5y+r5*Math.sin(a)]);}
  const pts6=[]; for(let i=0;i<6;i++){const a=-Math.PI/2+i*Math.PI/3;pts6.push([c6x+r6*Math.cos(a),c6y+r6*Math.sin(a)]);}
  return `<polygon points="${pts5.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#333" stroke-width="${SW}"/>
    <polygon points="${pts6.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#333" stroke-width="${SW}"/>
    <circle cx="${c6x}" cy="${c6y}" r="${(r6*0.55).toFixed(1)}" fill="none" stroke="#333" stroke-width="1.1" stroke-dasharray="3,2"/>
    ${T(c5x-r5-2, c5y, 'NH', 11, '#333')}`;
}

// Imidazole (His): entry at (cx, ty)
function Imidazole(cx, ty) {
  const r=22, cy5=ty+r+4;
  const pts=[]; for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;pts.push([cx+r*Math.cos(a),cy5+r*Math.sin(a)]);}
  const poly=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  // vertex[1]=upper-right (NH⁺), vertex[3]=lower-left (N)
  return `<polygon points="${poly}" fill="none" stroke="#333" stroke-width="${SW}"/>
    ${T(pts[1][0]+8, pts[1][1], 'NH⁺', 11, '#333')}
    ${T(pts[3][0]-10, pts[3][1], 'N', 11, '#333')}`;
}

// ── Per-amino-acid SVG functions ────────────────────────────
// Ca always at (cx, cy). SVG sized to content.

function svgAA(id) {
  const cx=110, cy=70;

  // vertical chain helper: draws atoms + bonds below cy, returns [svg_str, bottom_y]
  function chain(atoms) {
    let out='', y=cy+RS;
    out += VL(cx, cy+G, y-G);
    for(let i=0;i<atoms.length;i++){
      const a=atoms[i];
      if(typeof a === 'string'){
        out += T(cx, y, a);
        if(i<atoms.length-1) out += VL(cx, y+G, y+RS-G);
        y += RS;
      } else if(a.type==='branch'){
        // branch: { center, left, right }
        out += T(cx, y, a.center);
        const lw = a.left.length*4+4, rw = a.right.length*4+4;
        out += HL(cx-G, cx-RS+lw, y); out += T(cx-RS, y, a.left, 13);
        out += HL(cx+G, cx+RS-rw, y); out += T(cx+RS, y, a.right, 13);
        y += RS;
      } else if(a.type==='carbonyl'){
        // { label, right, below }
        out += T(cx, y, a.label||'C');
        out += HL(cx+G, cx+RS-G, y, true); out += T(cx+RS, y, a.right||'O');
        if(a.below){ out += VL(cx, y+G, y+RS-G); y+=RS; out += T(cx, y, a.below); }
        y += RS;
      } else if(a.type==='ring'){
        // { kind: 'benzene'|'indole'|'imidazole', [below] }
        const ringTop = y-8;
        if(a.kind==='benzene'){ out += Benzene(cx, ringTop); y += 24*2+10; }
        else if(a.kind==='indole'){ out += Indole(cx, ringTop); y += 20*2+16; }
        else if(a.kind==='imidazole'){ out += Imidazole(cx, ringTop); y += 22*2+12; }
        if(a.below){ out += VL(cx, y-RS+G, y-G); out += T(cx, y, a.below); y+=RS; }
      } else if(a.type==='hbranch'){
        // { right, below } — C node with single bond right + vertical below
        out += T(cx, y, 'C');
        out += HL(cx-G, cx-RS+G, y); out += T(cx-RS, y, a.left||'H', 13);
        out += HL(cx+G, cx+a.rw-G, y); out += T(cx+a.rw, y, a.right, 13);
        if(a.below){ out += VL(cx, y+G, y+RS-G); y+=RS; out += T(cx, y, a.below); }
        y += RS;
      }
    }
    return [out, y];
  }

  const DEFS = {
    Gly: { atoms:[{type:'single',v:'H'}], W:220, rW:30, rH:RS },
    Ala: { atoms:['CH₃'], W:220, rW:46, rH:RS },
    Val: { atoms:[{type:'branch',center:'CH',left:'CH₃',right:'CH₃'}], W:240, rW:100, rH:RS },
    Leu: { atoms:['CH₂',{type:'branch',center:'CH',left:'CH₃',right:'CH₃'}], W:240, rW:100, rH:RS*2 },
    Ile: { atoms:[{type:'hbranch',left:'H',right:'CH₃',rw:RS,below:'CH₂'},'CH₃'], W:250, rW:110, rH:RS*3 },
    Met: { atoms:['CH₂','CH₂',{type:'S'},'CH₃'], W:220, rW:46, rH:RS*4 },
    Ser: { atoms:['CH₂','O','H'], W:220, rW:34, rH:RS*3 },
    Thr: { atoms:[{type:'hbranch',left:'H',right:'OH',rw:RS,below:'CH₃'}], W:250, rW:100, rH:RS*2 },
    Cys: { atoms:['CH₂',{type:'S',label:'SH'}], W:220, rW:34, rH:RS*2 },
    Asn: { atoms:['CH₂',{type:'carbonyl',right:'O',below:'NH₂'}], W:240, rW:100, rH:RS*3 },
    Gln: { atoms:['CH₂','CH₂',{type:'carbonyl',right:'O',below:'NH₂'}], W:240, rW:100, rH:RS*4 },
    Lys: { atoms:['CH₂','CH₂','CH₂','CH₂','⁺NH₃'], W:220, rW:56, rH:RS*5 },
    Arg: { atoms:['CH₂','CH₂','CH₂','NH',{type:'guanidinium'}], W:250, rW:130, rH:RS*6 },
    His: { atoms:['CH₂',{type:'ring',kind:'imidazole'}], W:240, rW:110, rH:RS*2+50 },
    Phe: { atoms:['CH₂',{type:'ring',kind:'benzene'}], W:230, rW:80, rH:RS+56 },
    Tyr: { atoms:['CH₂',{type:'ring',kind:'benzene',below:'OH'}], W:230, rW:80, rH:RS+80 },
    Trp: { atoms:['CH₂',{type:'ring',kind:'indole'}], W:250, rW:130, rH:RS+50 },
    Asp: { atoms:['CH₂',{type:'carbonyl',right:'O',below:'O⁻'}], W:240, rW:100, rH:RS*3 },
    Glu: { atoms:['CH₂','CH₂',{type:'carbonyl',right:'O',below:'O⁻'}], W:240, rW:100, rH:RS*4 },
    Pro: { atoms:[], W:240, rW:90, rH:RS*3, special:'pro' },
  };

  const def = DEFS[id];
  if(!def) return `<svg width="200" height="80"><text x="10" y="40">?</text></svg>`;

  let inner = '';
  const W=def.W, cy2=cy;
  let rBoxY = cy+RS-10;
  let rBoxH = def.rH + 14;

  if(def.special === 'pro') {
    // Proline: N is in ring, no free H
    // Ca at (cx,cy), N left, COO⁻ up, H right (no H₃N⁺)
    const H = 220;
    const ry1=cy+RS, ry2=cy+RS*2, ry3=cy+RS*3;
    const nx = cx-RS*1.6;
    inner = `
    ${T(cx, cy-RS, 'COO⁻')}
    ${VL(cx, cy-RS+G+2, cy-G)}
    ${T(cx, cy, 'C')}
    ${T(nx, cy, 'N', 13)}
    ${HL(nx+10, cx-G, cy)}
    ${T(cx+RS, cy, 'H', 13)}
    ${HL(cx+G, cx+RS-5, cy)}
    ${RBox(cx, ry1, def.rH, def.rW)}
    ${VL(cx, cy+G, ry1-G)}
    ${T(cx, ry1, 'CH₂')}
    ${VL(cx, ry1+G, ry2-G)}
    ${T(cx, ry2, 'CH₂')}
    ${VL(cx, ry2+G, ry3-G)}
    ${T(cx, ry3, 'CH₂')}
    ${VL(cx, ry3+G, ry3+RS-G)}
    <line x1="${cx}" y1="${ry3+RS}" x2="${nx}" y2="${ry3+RS}" stroke="#333" stroke-width="${SW}"/>
    <line x1="${nx}" y1="${ry3+RS}" x2="${nx}" y2="${cy+G+2}" stroke="#333" stroke-width="${SW}"/>`;
    const H2 = ry3+RS+16;
    return `<svg width="${W}" height="${H2}" viewBox="0 0 ${W} ${H2}" xmlns="http://www.w3.org/2000/svg" ${FF}>${inner}</svg>`;
  }

  // Build chain
  let chainSvg='', bottomY=cy+RS;
  let y=cy+RS;
  chainSvg += VL(cx, cy+G, y-G); // first bond from Ca down

  for(let i=0;i<def.atoms.length;i++){
    const a=def.atoms[i];
    if(typeof a==='string'){
      chainSvg += T(cx, y, a);
      if(i<def.atoms.length-1) chainSvg += VL(cx, y+G, y+RS-G);
      y+=RS; bottomY=y;
    } else if(a.type==='branch'){
      chainSvg += T(cx, y, a.center);
      const lw=a.left.length*3+8, rw=a.right.length*3+8;
      chainSvg += HL(cx-G, cx-lw, y); chainSvg += T(cx-RS, y, a.left, 13);
      chainSvg += HL(cx+G, cx+rw, y); chainSvg += T(cx+RS, y, a.right, 13);
      y+=RS; bottomY=y;
    } else if(a.type==='hbranch'){
      chainSvg += T(cx, y, 'C');
      chainSvg += HL(cx-G, cx-RS+G, y); chainSvg += T(cx-RS, y, a.left||'H', 13);
      chainSvg += HL(cx+G, cx+(a.rw||RS)-G, y); chainSvg += T(cx+(a.rw||RS), y, a.right, 13);
      if(a.below){ chainSvg += VL(cx, y+G, y+RS-G); y+=RS; chainSvg += T(cx, y, a.below); }
      y+=RS; bottomY=y;
    } else if(a.type==='carbonyl'){
      chainSvg += T(cx, y, 'C');
      chainSvg += HL(cx+G, cx+RS-G, y, true); chainSvg += T(cx+RS, y, a.right||'O');
      if(a.below){ chainSvg += VL(cx, y+G, y+RS-G); y+=RS; chainSvg += T(cx, y, a.below); }
      y+=RS; bottomY=y;
    } else if(a.type==='S'){
      const lbl=a.label||'S';
      chainSvg += T(cx, y, lbl, FSZ, '#7a5500');
      if(i<def.atoms.length-1) chainSvg += VL(cx, y+G+2, y+RS-G);
      y+=RS; bottomY=y;
    } else if(a.type==='ring'){
      const ringTop=y-4;
      if(a.kind==='benzene'){
        chainSvg += Benzene(cx, ringTop);
        const rb=24; y+=rb*2+10; bottomY=y;
        if(a.below){
          chainSvg += VL(cx, y-RS+G, y-G);
          chainSvg += T(cx, y, a.below);
          y+=RS; bottomY=y;
        }
      } else if(a.kind==='indole'){
        chainSvg += Indole(cx, ringTop);
        y+=20*2+18; bottomY=y;
      } else if(a.kind==='imidazole'){
        chainSvg += Imidazole(cx, ringTop);
        y+=22*2+14; bottomY=y;
      }
    } else if(a.type==='guanidinium'){
      // C with =NH2 right and NH2 below
      chainSvg += T(cx, y, 'C');
      chainSvg += HL(cx+G, cx+RS-G, y, true); chainSvg += T(cx+RS, y, 'NH', 13);
      chainSvg += VL(cx, y+G, y+RS-G); y+=RS;
      chainSvg += T(cx, y, 'NH₂');
      y+=RS; bottomY=y;
    }
  }

  // Draw R-group highlight box (behind chain)
  const boxTop = cy+RS-12;
  const boxBot = bottomY+4;
  const bw = def.rW;
  const boxSvg = `<rect x="${cx-bw/2}" y="${boxTop}" width="${bw}" height="${boxBot-boxTop}" rx="4" fill="${RB}"/>`;

  const H = bottomY + 20;
  const content = BB(cx,cy) + boxSvg + chainSvg;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" ${FF}>${content}</svg>`;
}

  {id:'Thr',name:'트레오닌',  eng:'Threonine',    abbr1:'T',abbr3:'Thr',prop:'polar',   propKr:'극성 (하이드록실기)',essential:true, sulfur:false,aromatic:false,rgroup:'–CH(OH)CH₃',charge:'중성'},
  {id:'Cys',name:'시스테인',  eng:'Cysteine',     abbr1:'C',abbr3:'Cys',prop:'polar',   propKr:'극성 (싸이올기)',    essential:false,sulfur:true, aromatic:false,rgroup:'–CH₂SH',charge:'중성'},
  {id:'Tyr',name:'타이로신',  eng:'Tyrosine',     abbr1:'Y',abbr3:'Tyr',prop:'polar',   propKr:'극성 (방향족–OH)',  essential:false,sulfur:false,aromatic:true, rgroup:'–CH₂–C₆H₄–OH',charge:'중성'},
  {id:'Asn',name:'아스파라긴',eng:'Asparagine',   abbr1:'N',abbr3:'Asn',prop:'polar',   propKr:'극성 (아마이드기)', essential:false,sulfur:false,aromatic:false,rgroup:'–CH₂CONH₂',charge:'중성'},
  {id:'Gln',name:'글루타민',  eng:'Glutamine',    abbr1:'Q',abbr3:'Gln',prop:'polar',   propKr:'극성 (아마이드기)', essential:false,sulfur:false,aromatic:false,rgroup:'–CH₂CH₂CONH₂',charge:'중성'},
  {id:'Lys',name:'라이신',    eng:'Lysine',        abbr1:'K',abbr3:'Lys',prop:'positive',propKr:'양전하 (ε-NH₃⁺)',  essential:true, sulfur:false,aromatic:false,rgroup:'–(CH₂)₄NH₃⁺',charge:'양전하'},
  {id:'Arg',name:'아르지닌',  eng:'Arginine',     abbr1:'R',abbr3:'Arg',prop:'positive',propKr:'양전하 (구아니디늄)',essential:false,sulfur:false,aromatic:false,rgroup:'–(CH₂)₃NHC(=NH)NH₂',charge:'양전하'},
  {id:'His',name:'히스티딘',  eng:'Histidine',    abbr1:'H',abbr3:'His',prop:'positive',propKr:'양전하 (이미다졸,pKa≈6)',essential:true,sulfur:false,aromatic:true,rgroup:'–CH₂–이미다졸',charge:'양전하(약)'},
  {id:'Asp',name:'아스파트산',eng:'Aspartate',    abbr1:'D',abbr3:'Asp',prop:'negative',propKr:'음전하 (β-COO⁻)',  essential:false,sulfur:false,aromatic:false,rgroup:'–CH₂COO⁻',charge:'음전하'},
  {id:'Glu',name:'글루탐산',  eng:'Glutamate',    abbr1:'E',abbr3:'Glu',prop:'negative',propKr:'음전하 (γ-COO⁻)',  essential:false,sulfur:false,aromatic:false,rgroup:'–CH₂CH₂COO⁻',charge:'음전하'},
];

const RANGES={all:a=>true,nonpolar:a=>a.prop==='nonpolar',polar:a=>a.prop==='polar',positive:a=>a.prop==='positive',negative:a=>a.prop==='negative',charged:a=>a.prop==='positive'||a.prop==='negative',aromatic:a=>a.aromatic,essential:a=>a.essential,sulfur:a=>a.sulfur,wrong:null};

let mode='s2n',inputMode='type',orderMode='random',rangeKey='all';
let pool=[],idx=0,cor=0,wrn=0,streak=0,answered=false,wrongList=[],curM='';

const shuf=a=>[...a].sort(()=>Math.random()-.5);
const getBase=()=>rangeKey==='wrong'?(wrongList.length?[...wrongList]:[...AA]):(RANGES[rangeKey]?AA.filter(RANGES[rangeKey]):[...AA]);
const getPool=()=>{const b=getBase();return orderMode==='random'?shuf(b):[...b];};

function setMode(m){mode=m;['s2n','s2a','n2a','a2n','n2p','s2p','mix'].forEach(k=>document.getElementById('m-'+k).classList.toggle('on',k===m));restart();}
function setInput(v){inputMode=v;document.getElementById('t-type').classList.toggle('on',v==='type');document.getElementById('t-mc').classList.toggle('on',v==='mc');restart();}
function setOrder(v){orderMode=v;document.getElementById('t-rand').classList.toggle('on',v==='random');document.getElementById('t-seq').classList.toggle('on',v==='seq');restart();}
function setRange(btn){rangeKey=btn.dataset.range;document.querySelectorAll('.ri').forEach(b=>b.classList.toggle('on',b===btn));restart();}

function restart(){pool=getPool();idx=0;cor=0;wrn=0;streak=0;wrongList=[];updateStats();nextQ();}
function retryWrong(){if(!wrongList.length){restart();return;}pool=orderMode==='random'?shuf([...wrongList]):[...wrongList];idx=0;cor=0;wrn=0;streak=0;updateStats();nextQ();}
function updateStats(){document.getElementById('s-cor').textContent=cor;document.getElementById('s-wrn').textContent=wrn;document.getElementById('s-prog').textContent=idx+'/'+pool.length;document.getElementById('s-streak').textContent=streak;document.getElementById('pbar').style.width=pool.length?Math.round(idx/pool.length*100)+'%':'0%';}
function pickSub(){if(mode==='mix'){const o=['s2n','s2a','n2a','a2n','n2p'];return o[Math.floor(Math.random()*o.length)];}return mode;}
function ctag(aa){return `<span class="ctag" style="${PSTYLE[aa.prop]||''}">${aa.propKr}</span>`;}

function makeMC(aa,sub){
  const base=getBase().filter(a=>a.id!==aa.id);const fp=AA.filter(a=>a.id!==aa.id);const dp=base.length>=3?base:fp;const all=shuf([aa,...shuf(dp).slice(0,3)]);const isProp=sub==='n2p'||sub==='s2p';
  if(isProp){const ps=['nonpolar','polar','positive','negative'];const oth=ps.filter(p=>p!==aa.prop);return shuf([aa.prop,...shuf(oth).slice(0,3)]).map(p=>`<button class="opt" data-prop="${p}" onclick="pickPropMC(this,'${p}')">${PKR[p]}<br><small style="font-size:11px;opacity:.7">${{nonpolar:'소수성·물 배제',polar:'수소결합 가능',positive:'pH7에서 +전하',negative:'pH7에서 −전하'}[p]}</small></button>`).join('');}
  return all.map(a=>{let lbl='';if(sub==='s2n'||sub==='a2n')lbl=`${a.name}<br><small style="font-size:11px;opacity:.7">${a.eng}</small>`;else if(sub==='s2a'||sub==='n2a')lbl=`<strong>${a.abbr3}</strong> / ${a.abbr1}`;else lbl=a.name;return `<button class="opt" data-id="${a.id}" onclick="pickMC(this,'${a.id}')">${lbl}</button>`;}).join('');
}

const QL={'s2n':'구조식 → 이름','s2a':'구조식 → 약자 (3글자 / 1글자)','n2a':'이름 → 약자','a2n':'약자 → 이름','n2p':'이름 → R기 특성','s2p':'구조식 → R기 특성'};

function nextQ(){
  if(idx>=pool.length){showResult();return;}
  answered=false;const aa=pool[idx];curM=pickSub();const useMC=inputMode==='mc';const needSt=curM==='s2n'||curM==='s2a'||curM==='s2p';
  let qH=`<div class="qlabel">${QL[curM]||curM}</div>`;
  if(needSt){qH+=`<div class="svgwrap">${drawAA(aa)}</div>`;}
  else if(curM==='n2a'){qH+=`<div class="qbig md">${aa.name}</div><div class="qsub">${aa.eng}</div>${ctag(aa)}`;}
  else if(curM==='a2n'){qH+=`<div class="qbig">${aa.abbr3}</div><div class="qsub">1글자: ${aa.abbr1}</div>${ctag(aa)}`;}
  else{qH+=`<div class="qbig md">${aa.name}</div><div class="qsub">${aa.eng} · ${aa.abbr3}/${aa.abbr1}</div>`;}
  let aH='';
  if(useMC){aH=`<div class="opts">${makeMC(aa,curM)}</div><div class="fb" id="fb"></div><button class="btn" id="nb" onclick="nextQ()" style="display:none">다음 문제 →</button>`;}
  else if(curM==='s2n'||curM==='a2n'){aH=`<div class="input-area"><div class="input-row"><label>한국어명</label><input type="text" id="inp-kr" placeholder="예: 알라닌" autocomplete="off"/></div></div><div class="hint">Enter로 확인 · 영문명·약자도 인정</div><div class="fb" id="fb"></div><div class="brow"><button class="btn pri" id="sbtn" onclick="checkTyped()">확인</button><button class="btn" onclick="skipQ()">모르겠어요</button></div><button class="btn" id="nb" onclick="nextQ()" style="display:none">다음 문제 →</button>`;}
  else if(curM==='s2a'||curM==='n2a'){aH=`<div class="input-area"><div class="input-row"><label>3글자</label><input type="text" id="inp-3" placeholder="예: Ala" autocomplete="off"/></div><div class="input-row"><label>1글자</label><input type="text" id="inp-1" placeholder="예: A" autocomplete="off"/></div></div><div class="hint">Tab으로 다음 칸 · Enter로 확인</div><div class="fb" id="fb"></div><div class="brow"><button class="btn pri" id="sbtn" onclick="checkTyped()">확인</button><button class="btn" onclick="skipQ()">모르겠어요</button></div><button class="btn" id="nb" onclick="nextQ()" style="display:none">다음 문제 →</button>`;}
  else{aH=`<div class="input-area"><div class="input-row"><label>R기 특성</label><input type="text" id="inp-prop" placeholder="비극성 / 극성 / 양전하 / 음전하" autocomplete="off"/></div></div><div class="hint">Enter로 확인</div><div class="fb" id="fb"></div><div class="brow"><button class="btn pri" id="sbtn" onclick="checkTyped()">확인</button><button class="btn" onclick="skipQ()">모르겠어요</button></div><button class="btn" id="nb" onclick="nextQ()" style="display:none">다음 문제 →</button>`;}
  document.getElementById('qa').innerHTML=`<div class="q-card">${qH}</div>${aH}`;
  setTimeout(()=>{const inp=document.getElementById('inp-kr')||document.getElementById('inp-3')||document.getElementById('inp-prop');if(inp)inp.focus();const i3=document.getElementById('inp-3'),i1=document.getElementById('inp-1');if(i3&&i1){i3.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();i1.focus();}if(e.key==='Enter')checkTyped();});i1.addEventListener('keydown',e=>{if(e.key==='Enter')checkTyped();});}else if(inp){inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkTyped();});}},30);
}

function checkTyped(){
  if(answered)return;const aa=pool[idx];let ok=false;
  if(curM==='s2n'||curM==='a2n'){const v=(document.getElementById('inp-kr').value||'').trim().toLowerCase();ok=v===aa.name||v===aa.eng.toLowerCase()||v===aa.abbr3.toLowerCase()||v===aa.id.toLowerCase();document.getElementById('inp-kr').classList.add(ok?'ok':'ng');if(!ok)showFb(false,`정답: ${aa.name} (${aa.eng})`);else showFb(true);}
  else if(curM==='s2a'||curM==='n2a'){const v3=(document.getElementById('inp-3').value||'').trim();const v1=(document.getElementById('inp-1').value||'').trim();const ok3=v3.toLowerCase()===aa.abbr3.toLowerCase();const ok1=v1.toUpperCase()===aa.abbr1;ok=ok3&&ok1;document.getElementById('inp-3').classList.add(ok3?'ok':'ng');document.getElementById('inp-1').classList.add(ok1?'ok':'ng');if(!ok)showFb(false,`정답: ${aa.abbr3} / ${aa.abbr1}`);else showFb(true);}
  else{const v=(document.getElementById('inp-prop').value||'').trim();const pm={'비극성':'nonpolar','극성':'polar','양전하':'positive','음전하':'negative','nonpolar':'nonpolar','polar':'polar','positive':'positive','negative':'negative'};ok=pm[v]===aa.prop;document.getElementById('inp-prop').classList.add(ok?'ok':'ng');if(!ok)showFb(false,`정답: ${PKR[aa.prop]}`);else showFb(true);}
  finalize(ok,aa);
}
function pickMC(btn,id){if(answered)return;const aa=pool[idx];const ok=id===aa.id;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.id===aa.id)b.classList.add('ok');});if(!ok){btn.classList.add('ng');showFb(false,getCorrect(aa));}else showFb(true);finalize(ok,aa);}
function pickPropMC(btn,prop){if(answered)return;const aa=pool[idx];const ok=prop===aa.prop;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.prop===aa.prop)b.classList.add('ok');});if(!ok){btn.classList.add('ng');showFb(false,`정답: ${PKR[aa.prop]}`);}else showFb(true);finalize(ok,aa);}
function getCorrect(aa){if(curM==='s2n'||curM==='a2n')return `정답: ${aa.name} (${aa.eng})`;if(curM==='s2a'||curM==='n2a')return `정답: ${aa.abbr3} / ${aa.abbr1}`;return `정답: ${PKR[aa.prop]}`;}
function skipQ(){if(answered)return;const aa=pool[idx];showFb(false,getCorrect(aa));['inp-kr','inp-3','inp-1','inp-prop'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.add('ng');});finalize(false,aa);}
function showFb(ok,msg){const f=document.getElementById('fb');if(!f)return;f.textContent=ok?'정답!':'오답 — '+(msg||'');f.className='fb '+(ok?'ok':'ng');}

function finalize(ok,aa){
  answered=true;idx++;if(ok){cor++;streak++;}else{wrn++;streak=0;if(!wrongList.find(a=>a.id===aa.id))wrongList.push(aa);}
  const s=document.getElementById('sbtn');if(s)s.disabled=true;updateStats();
  const nb=document.getElementById('nb');if(nb){nb.style.display='block';setTimeout(()=>nb.focus(),30);}
  if(!ok){const qa=document.getElementById('qa');const info=document.createElement('div');info.className='rinfo';info.innerHTML=`<strong>${aa.name} (${aa.eng})</strong> · ${aa.abbr3} / ${aa.abbr1}<br>R기: ${aa.rgroup}<br>특성: ${aa.propKr} · 전하: ${aa.charge}${aa.essential?' · ★필수아미노산':''}${aa.sulfur?' · 황 함유':''}`;qa.insertBefore(info,document.getElementById('nb'));}
}

function showResult(){
  const total=cor+wrn,pct=total?Math.round(cor/total*100):0;const grade=pct===100?'완벽해요!':pct>=90?'훌륭해요!':pct>=70?'잘했어요!':pct>=50?'절반 이상 맞혔어요!':'더 연습해봐요!';
  let wH='';if(wrongList.length){const rows=wrongList.map(a=>`<tr><td><strong>${a.abbr3}</strong>/${a.abbr1}</td><td>${a.name}<br><span style="font-size:11px;color:var(--text3)">${a.eng}</span></td><td style="font-size:12px">${a.rgroup}</td><td><span class="ctag" style="${PSTYLE[a.prop]||''};font-size:11px">${PKR[a.prop]}</span></td></tr>`).join('');wH=`<div class="wsec"><h3>틀린 아미노산 (${wrongList.length}개)</h3><table class="wtbl"><thead><tr><th>약자</th><th>이름</th><th>R기</th><th>특성</th></tr></thead><tbody>${rows}</tbody></table></div>`;}
  document.getElementById('qa').innerHTML=`<div class="result"><div class="score">${cor}/${total}</div><div class="grade">${pct}점 — ${grade}</div><div class="rbtns"><button class="btn" onclick="restart()">처음부터 다시</button>${wrongList.length?`<button class="btn pri" onclick="retryWrong()">틀린 것만 다시</button>`:''}</div>${wH}</div>`;
  document.getElementById('pbar').style.width='100%';
}

restart();
</script>
</body>
</html>
