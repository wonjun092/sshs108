<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Vocabulary Master</title>
    <style>
      /* [style.css 기반 디자인] */
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: linear-gradient(to right, #74ebd5, #9face6);
        min-height: 100vh;
        padding-bottom: 50px;
      }

      /* 헤더를 양 옆으로 꽉 차게 설정 */
      .header {
        background-color: #2c3e50;
        color: white;
        padding: 20px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        width: 100%;
        box-sizing: border-box;
        /* 패딩 포함 너비 계산 */
        margin-bottom: 30px;
      }

      .header span {
        font-weight: bold;
        font-size: 1.4em;
        letter-spacing: 1px;
      }

      .book-selector {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .book-tab {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.35);
        padding: 9px 16px;
      }

      .book-tab:hover,
      .book-tab.active {
        background: #3498db;
        border-color: #3498db;
      }

      .record-option {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
        padding: 14px 16px;
        border: 1px solid #b9ddf5;
        border-radius: 8px;
        background: #eef8ff;
        color: #234;
      }

      .record-option label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: bold;
        cursor: pointer;
        white-space: nowrap;
      }

      .record-option input {
        width: 18px;
        height: 18px;
        margin: 0;
      }

      .record-note,
      .ranking-status,
      #record-status {
        color: #667;
        font-size: 0.92em;
      }

      #record-status {
        min-height: 1.4em;
        margin: -14px 0 18px;
      }

      .ranking-list {
        display: grid;
        gap: 10px;
        margin-top: 20px;
      }

      .ranking-row {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border: 1px solid #e6e9ed;
        border-radius: 10px;
        background: #f8fafc;
      }

      .rank-badge {
        display: inline-grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #e6ebef;
        color: #34495e;
        font-weight: bold;
      }

      .rank-1 .rank-badge {
        background: #ffd700;
        color: #5b4900;
      }

      .rank-2 .rank-badge {
        background: #c0c0c0;
        color: #3f4650;
      }

      .rank-3 .rank-badge {
        background: #cd7f32;
        color: white;
      }

      .ranking-user {
        min-width: 0;
        overflow-wrap: anywhere;
        font-weight: bold;
      }

      .ranking-score {
        color: #2c3e50;
        font-size: 1.1em;
        font-weight: bold;
      }

      @media (max-width: 700px) {
        .header {
          align-items: flex-start;
          flex-direction: column;
          gap: 14px;
          padding: 18px 24px 18px 74px;
        }

        .header > div {
          padding-left: 0 !important;
        }
      }

      .container {
        width: 90%;
        margin: auto;
        max-width: 900px;
      }

      .card {
        background: white;
        padding: 30px;
        margin: 15px 0;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      button {
        background-color: #3498db;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: 0.3s;
        font-weight: bold;
      }

      button:hover {
        background-color: #2980b9;
        transform: translateY(-1px);
      }

      button.secondary {
        background-color: #e67e22;
      }

      button.secondary:hover {
        background-color: #d35400;
      }

      input[type="text"],
      input[type="number"] {
        padding: 12px;
        margin: 10px 0;
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 16px;
      }

      /* 챕터 그리드 */
      .chapter-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 12px;
        margin: 20px 0;
        background: #fdfdfd;
        padding: 20px;
        border: 1px solid #eee;
        border-radius: 8px;
      }

      .chapter-item {
        display: flex;
        align-items: center;
        font-size: 0.95em;
        cursor: pointer;
      }

      .chapter-item input {
        width: auto;
        margin-right: 8px;
        cursor: pointer;
      }

      .hidden {
        display: none;
      }

      /* 퀴즈 UI */
      .quiz-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .chap-tag {
        background: #34495e;
        color: white;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.85em;
        font-weight: bold;
      }

      #progress {
        color: #2c3e50;
        font-weight: bold;
        font-size: 1.1em;
      }

      .question-box {
        border-left: 6px solid #3498db;
        padding-left: 20px;
        margin: 25px 0;
      }

      .definition {
        font-style: italic;
        color: #555;
        font-size: 1.15em;
        margin-top: 12px;
        line-height: 1.4;
      }

      .hint-toggle {
        background: transparent;
        color: #2980b9;
        border: 1px solid #3498db;
        padding: 7px 12px;
        margin-top: 14px;
        font-size: 0.95em;
      }

      .hint-toggle:hover {
        background: #eaf6fd;
      }

      .sentence {
        font-weight: bold;
        color: #222;
        line-height: 1.6;
        font-size: 1.1em;
      }

      .feedback {
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
        margin: 20px 0;
        font-size: 1.1em;
      }

      .correct {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .incorrect {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div style="display: flex; align-items: center; padding-left: 50px">
        <span id="book-title">📖 The Wednesday Wars Vocabulary</span>
      </div>
      <div class="book-selector" aria-label="책 선택">
        <button
          type="button"
          class="book-tab"
          data-book="holes"
          onclick="selectBook('holes')"
        >
          Holes
        </button>
        <button
          type="button"
          class="book-tab active"
          data-book="wednesdayWars"
          onclick="selectBook('wednesdayWars')"
        >
          Wednesday Wars
        </button>
        <button
          type="button"
          id="ranking-tab"
          class="book-tab"
          onclick="showRanking()"
        >
          Ranking
        </button>
      </div>
    </div>

    <div class="container">
      <div id="setup-section" class="card">
        <h3 style="margin-top: 0">시험 범위 설정</h3>
        <p id="range-help" style="color: #666">
          원하는 월(챕터)을 선택하고 문제 수를 입력하세요.
        </p>
        <div style="margin-bottom: 15px">
          <button onclick="toggleAll(true)">전체 선택</button>
          <button onclick="toggleAll(false)" style="background-color: #95a5a6">
            전체 해제
          </button>
        </div>

        <div class="chapter-grid" id="chapter-grid"></div>

        <label
          >문제 수 (선택 범위 내 최대
          <span id="max-count" style="color: #e74c3c; font-weight: bold">0</span
          >개):</label
        >
        <input type="number" id="question-count" value="10" />

        <div id="record-option" class="record-option hidden">
          <label>
            <input type="checkbox" id="record-score" checked />
            기록 재기
          </label>
          <span class="record-note"
            >Wednesday Wars 전체 범위를 풀 때만 랭킹에 반영됩니다.</span
          >
        </div>

        <button
          style="width: 100%; margin-top: 15px; font-size: 1.1em"
          onclick="startQuiz()"
        >
          테스트 시작
        </button>
      </div>

      <div id="quiz-section" class="card hidden">
        <div class="quiz-info">
          <div id="progress">문제 1 / 10</div>
          <div class="chap-tag" id="display-chap">Ch. ??</div>
        </div>
        <div class="question-box">
          <div class="sentence" id="display-sent"></div>
          <button
            type="button"
            id="definition-toggle"
            class="hint-toggle hidden"
            aria-expanded="false"
            aria-controls="display-def"
            onclick="toggleHint('definition-toggle')"
          >
            영-영 풀이
          </button>
          <button
            type="button"
            id="korean-meaning-toggle"
            class="hint-toggle hidden"
            aria-expanded="false"
            aria-controls="display-korean-meaning"
            onclick="toggleHint('korean-meaning-toggle')"
          >
            한글 뜻
          </button>
          <button
            type="button"
            id="hint-toggle"
            class="hint-toggle hidden"
            aria-expanded="false"
            aria-controls="display-hint"
            onclick="toggleHint('hint-toggle')"
          >
            추가 힌트
          </button>
          <div class="definition hidden" id="display-def"></div>
          <div class="definition hidden" id="display-korean-meaning"></div>
          <div class="definition hidden" id="display-hint"></div>
        </div>
        <input
          type="text"
          id="answer-input"
          placeholder="정답 단어를 입력하세요"
          autocomplete="off"
        />
        <div id="feedback" class="feedback hidden"></div>
        <button id="submit-btn" style="width: 100%" onclick="checkAnswer()">
          정답 확인
        </button>
        <button
          id="next-btn"
          style="width: 100%"
          class="hidden"
          onclick="nextQuestion()"
        >
          다음 문제
        </button>
      </div>

      <div id="result-section" class="card hidden" style="text-align: center">
        <h2>시험 결과</h2>
        <div
          id="final-score"
          style="
            font-size: 2.5em;
            font-weight: bold;
            color: #2c3e50;
            margin: 30px 0;
          "
        ></div>
        <div id="record-status"></div>
        <button
          id="retry-wrong-btn"
          class="secondary"
          style="width: 100%; margin-bottom: 12px"
          onclick="retryWrong()"
        >
          틀린 문제만 다시 풀기
        </button>
        <button
          style="width: 100%; background-color: #95a5a6"
          onclick="resetToSetup()"
        >
          범위 다시 선택하기
        </button>
      </div>

          기록을 불러오는 중입니다.
        </p>
        <div class="ranking-list" id="ranking-list"></div>
      </div>
    </div>

        holes: {

          title: "The Wednesday Wars Vocabulary",
          rangeHelp: "원하는 월(챕터)을 선택하고 문제 수를 입력하세요.",

      let currentBookKey = "wednesdayWars";
      let quizData = [];
      let wrongWords = [];
      let currentIdx = 0;
      let score = 0;
      let shouldRecordCurrentQuiz = false;
      let recordOptionEligible = false;

      const grid = document.getElementById("chapter-grid");

      function getCurrentBook() {
        return books[currentBookKey];
      }

      function renderBookSetup() {
        const book = getCurrentBook();
        const chapterList = [...new Set(book.vocabulary.map((v) => v.ch))];
        document.getElementById("book-title").innerText = `📖 ${book.title}`;
        document.getElementById("range-help").innerText = book.rangeHelp;
        document.querySelectorAll(".book-tab").forEach((button) => {
          button.classList.toggle(
            "active",
            button.dataset.book === currentBookKey,
          );
        });
        grid.innerHTML = "";
        chapterList.forEach((ch) => {
          const label = document.createElement("label");
          label.className = "chapter-item";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = ch;
          checkbox.checked = true;
          checkbox.addEventListener("change", updateMax);
          label.append(
            checkbox,
            document.createTextNode(` ${book.chapterLabel(ch)}`),
          );
          grid.appendChild(label);
        });
        updateMax();
      }

      function selectBook(bookKey) {
        if (!books[bookKey]) return;
        currentBookKey = bookKey;
        resetToSetup();
        renderBookSetup();
      }

      function toggleAll(status) {
        document
          .querySelectorAll("#chapter-grid input")
          .forEach((i) => (i.checked = status));
        updateMax();
      }

      function updateMax() {
        const selected = Array.from(
          document.querySelectorAll("#chapter-grid input:checked"),
        ).map((i) => i.value);
        const count = getCurrentBook().vocabulary.filter((v) =>
          selected.includes(v.ch),
        ).length;
        document.getElementById("max-count").innerText = count;
        document.getElementById("question-count").value = count; // 기본값 15 또는 최대값
        updateRecordOption();
      }

      function updateRecordOption() {
        const selected = document.querySelectorAll(
          "#chapter-grid input:checked",
        ).length;
        const chapterCount = new Set(
          getCurrentBook().vocabulary.map((v) => v.ch),
        ).size;
        const requested = parseInt(
          document.getElementById("question-count").value,
          10,
        );
        const eligible =
          currentBookKey === "wednesdayWars" &&
          selected === chapterCount &&
          requested === getCurrentBook().vocabulary.length;
        const option = document.getElementById("record-option");
        const checkbox = document.getElementById("record-score");

        option.classList.toggle("hidden", !eligible);
        if (eligible && !recordOptionEligible) checkbox.checked = true;
        recordOptionEligible = eligible;
      }

      function startQuiz() {
        const selected = Array.from(
          document.querySelectorAll("#chapter-grid input:checked"),
        ).map((i) => i.value);
        const max = getCurrentBook().vocabulary.filter((v) =>
          selected.includes(v.ch),
        ).length;
        const requested = parseInt(
          document.getElementById("question-count").value,
          10,
        );
        if (selected.length === 0) return alert("챕터를 선택하세요!");
        if (!Number.isFinite(requested) || requested < 1)
          return alert("문제 수를 1개 이상 입력하세요!");
        const num = Math.min(requested, max);

        shouldRecordCurrentQuiz =
          recordOptionEligible &&
          document.getElementById("record-score").checked &&
          num === getCurrentBook().vocabulary.length;

        quizData = getCurrentBook()
          .vocabulary.filter((v) => selected.includes(v.ch))
          .sort(() => Math.random() - 0.5)
          .slice(0, num);
        initQuiz();
      }

      function initQuiz() {
        currentIdx = 0;
        score = 0;
        wrongWords = [];
        document.getElementById("setup-section").classList.add("hidden");
        document.getElementById("result-section").classList.add("hidden");
        document.getElementById("ranking-section").classList.add("hidden");
        document.getElementById("quiz-section").classList.remove("hidden");
        showQuestion();
      }

      function showQuestion() {
        const q = quizData[currentIdx];
        const input = document.getElementById("answer-input");
        const submitBtn = document.getElementById("submit-btn");
        const nextBtn = document.getElementById("next-btn");
        const feedback = document.getElementById("feedback");

        // 1. 문제 정보 업데이트
        document.getElementById("progress").innerText =
          `문제 ${currentIdx + 1} / ${quizData.length}`;
        document.getElementById("display-chap").innerText =
          getCurrentBook().quizChapterLabel(q.ch);

        // 2. 각 힌트는 독립적으로 표시하며 매 문제마다 접힌 상태로 초기화합니다.
        renderHint("definition-toggle", q.definition, "영-영 풀이");
        renderHint("korean-meaning-toggle", q.koreanMeaning, "한글 뜻");
        // Holes의 hint/hintType(예: Synonym)은 definition과 별도로 보존합니다.
        renderHint(
          "hint-toggle",
          q.hint,
          q.hintType ? `추가 힌트 (${q.hintType})` : "추가 힌트",
        );

        // 3. 엑셀의 Blanked Example 그대로 사용 (이미 __________ 처리됨)
        document.getElementById("display-sent").innerText = q.sent;

        // 4. 입력창 상태 초기화 (핵심: 다시 입력 가능하도록 설정)
        input.value = "";
        input.disabled = false; // disabled 해제
        input.readOnly = false; // readOnly 해제

        // 5. 버튼 및 피드백 UI 초기화
        feedback.classList.add("hidden");
        submitBtn.classList.remove("hidden");
        nextBtn.classList.add("hidden");

        // 6. 커서 자동 포커스 (엔터키 흐름이 끊기지 않게 함)
        setTimeout(() => {
          input.focus();
        }, 10);
      }

      // Optional fields: definition = 영영풀이, koreanMeaning = 한글 뜻,
      // hint/hintType = 기존 추가 힌트. 빈 값은 해당 버튼을 숨깁니다.
      function renderHint(buttonId, value, label) {
        const button = document.getElementById(buttonId);
        const panel = document.getElementById(button.getAttribute("aria-controls"));
        const text = typeof value === "string" ? value.trim() : "";
        panel.innerText = text ? `${label}: ${text}` : "";
        panel.classList.add("hidden");
        button.innerText = label;
        button.classList.toggle("hidden", !text);
        button.setAttribute("aria-expanded", "false");
      }

      function toggleHint(buttonId) {
        const button = document.getElementById(buttonId);
        const panel = document.getElementById(button.getAttribute("aria-controls"));
        if (button.classList.contains("hidden")) return;
        const willShow = panel.classList.contains("hidden");
        panel.classList.toggle("hidden", !willShow);
        button.setAttribute("aria-expanded", String(willShow));
      }

      function normalizeAnswer(value) {
        return (value || "")
          .toString()
          .trim()
          .toLowerCase()
          .replace(/[’‘]/g, "'")
          .replace(/[“”]/g, '"')
          .replace(/\s+/g, " ");
      }

      function checkAnswer() {
        const input = document.getElementById("answer-input");
        const q = quizData[currentIdx];
        const user = normalizeAnswer(input.value);
        const accepted = [q.correctFill, ...(q.acceptedAnswers || [])].map(
          normalizeAnswer,
        );
        const fb = document.getElementById("feedback");

        fb.classList.remove("hidden");
        if (accepted.includes(user)) {
          fb.innerText = "정답입니다! ✨";
          fb.className = "feedback correct";
          score++;
        } else {
          fb.innerText = `틀렸습니다. 정답: [ ${q.correctFill} ]`;
          fb.className = "feedback incorrect";
          wrongWords.push(q);
        }

        // [수정] disabled 대신 readOnly를 쓰면 키보드 포커스가 유지되어 엔터가 더 잘 먹힙니다.
        input.readOnly = true;
        document.getElementById("submit-btn").classList.add("hidden");
        document.getElementById("next-btn").classList.remove("hidden");
      }

      function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) showQuestion();
        else showResult();
      }

      function showResult() {
        document.getElementById("quiz-section").classList.add("hidden");
        document.getElementById("result-section").classList.remove("hidden");
        document.getElementById("final-score").innerText =
          `${score} / ${quizData.length}`;
        document.getElementById("record-status").innerText = "";

        if (shouldRecordCurrentQuiz) submitRankingScore();

        const retryBtn = document.getElementById("retry-wrong-btn");
        if (wrongWords.length > 0) {
          retryBtn.innerText = `틀린 문제만 다시 풀기 (${wrongWords.length}개)`;
          retryBtn.classList.remove("hidden");
        } else {
          retryBtn.classList.add("hidden");
        }
      }

      function retryWrong() {
        shouldRecordCurrentQuiz = false;
        quizData = [...wrongWords].sort(() => Math.random() - 0.5);
        initQuiz();
      }

      async function submitRankingScore() {
        const status = document.getElementById("record-status");
        status.innerText = "기록을 저장하는 중입니다...";

        try {
          const response = await fetch("/api/english-ranking", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              score,
              total: quizData.length,
            }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "기록 저장 실패");
          status.innerText = data.improved
            ? "새 최고 기록이 저장되었습니다."
            : "기존 최고 기록이 더 높아 그대로 유지되었습니다.";
        } catch (error) {
          status.innerText =
            error instanceof Error
              ? error.message
              : "기록을 저장하지 못했습니다.";
        }
      }

      async function showRanking() {
        document.getElementById("setup-section").classList.add("hidden");
        document.getElementById("quiz-section").classList.add("hidden");
        document.getElementById("result-section").classList.add("hidden");
        document.getElementById("ranking-section").classList.remove("hidden");
        document.getElementById("book-title").innerText =
          "🏆 Wednesday Wars Ranking";
        document.querySelectorAll(".book-tab").forEach((button) => {
          button.classList.toggle("active", button.id === "ranking-tab");
        });

        const status = document.getElementById("ranking-status");
        const list = document.getElementById("ranking-list");
        status.innerText = "기록을 불러오는 중입니다.";
        list.replaceChildren();

        try {
          const response = await fetch("/api/english-ranking", {
            cache: "no-store",
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "랭킹 불러오기 실패");

          if (data.rankings.length === 0) {
            status.innerText = "아직 등록된 기록이 없습니다.";
            return;
          }

          status.innerText =
            "기록 재기를 선택한 사용자의 최고 기록만 표시됩니다.";
          data.rankings.forEach((entry) => {
            const row = document.createElement("div");
            row.className = `ranking-row rank-${entry.rank}`;

            const badge = document.createElement("span");
            badge.className = "rank-badge";
            badge.innerText = entry.rank;

            const user = document.createElement("span");
            user.className = "ranking-user";
            user.innerText = entry.loginId;

            const scoreCell = document.createElement("span");
            scoreCell.className = "ranking-score";
            scoreCell.innerText = `${entry.score} / ${entry.total}`;

            row.append(badge, user, scoreCell);
            list.appendChild(row);
          });
        } catch (error) {
          status.innerText =
            error instanceof Error
              ? error.message
              : "랭킹을 불러오지 못했습니다.";
        }
      }

      function resetToSetup() {
        quizData = [];
        wrongWords = [];
        currentIdx = 0;
        score = 0;
        document.getElementById("quiz-section").classList.add("hidden");
        document.getElementById("result-section").classList.add("hidden");
        document.getElementById("ranking-section").classList.add("hidden");
        document.getElementById("setup-section").classList.remove("hidden");
      }

      window.addEventListener("keydown", (e) => {
        // 엔터키가 눌렸을 때만 작동
        if (e.key === "Enter" && !e.isComposing) {
          // 버튼의 Enter는 해당 버튼의 기본 동작만 실행합니다(힌트/책 선택 등).
          if (e.target.closest("button")) return;
          const submitBtn = document.getElementById("submit-btn");
          const nextBtn = document.getElementById("next-btn");
          const quizSection = document.getElementById("quiz-section");

          // 메인 설정 화면이 아닐 때만(퀴즈 진행 중일 때만) 작동
          if (!quizSection.classList.contains("hidden")) {
            e.preventDefault();
            // 1. '정답 확인' 버튼이 보일 때 (채점 전)
            if (!submitBtn.classList.contains("hidden")) {
              checkAnswer();
            }
            // 2. '다음 문제' 버튼이 보일 때 (채점 후)
            else if (!nextBtn.classList.contains("hidden")) {
              nextQuestion();
            }
          }
        }
      });

      document
        .getElementById("question-count")
        .addEventListener("input", updateRecordOption);

      renderBookSetup();
    </script>
  </body>
</html>
