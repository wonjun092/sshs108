<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>🧬 호르몬 마스터</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#0f1117; --card:#1a1d27; --card-h:#222633; --accent:#6c5ce7; --accent-l:#a29bfe;
  --ok:#00b894; --ok-bg:rgba(0,184,148,.12); --no:#fd79a8; --no-bg:rgba(253,121,168,.12);
  --txt:#dfe6e9; --dim:#636e72; --border:#2d3436; --gold:#fdcb6e; --silver:#b2bec3;
}
body { background:var(--bg); color:var(--txt); font-family:'Noto Sans KR',sans-serif; min-height:100vh; min-height:100dvh; overflow-x:hidden; }
.screen { display:none; flex-direction:column; align-items:center; min-height:100vh; min-height:100dvh; padding:20px; padding-bottom:env(safe-area-inset-bottom,20px); }
.screen.active { display:flex; }
button { font-family:inherit; cursor:pointer; border:none; outline:none; -webkit-appearance:none; }
@keyframes fadeSlide { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
@keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }

/* HOME */
.home-logo { font-size:52px; margin-bottom:8px; margin-top:15vh; }
.home-title { color:var(--accent-l); font-size:28px; font-weight:900; letter-spacing:-1px; }
.home-sub { color:var(--dim); font-size:13px; margin-top:6px; }
.mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:400px; width:100%; margin-top:40px; }
.mode-btn { background:var(--card); border:1.5px solid var(--border); border-radius:14px; padding:22px 14px;
  color:var(--txt); font-size:14px; font-weight:500; text-align:center; line-height:1.5; transition:all .2s; }
.mode-btn:active { background:var(--card-h); border-color:var(--accent); transform:scale(.97); }
.table-toggle { margin-top:28px; background:transparent; border:1px solid var(--border); border-radius:10px;
  padding:10px 24px; color:var(--dim); font-size:13px; }
.ref-table { margin-top:14px; max-width:700px; width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.ref-table table { width:100%; border-collapse:collapse; font-size:12px; }
.ref-table th { background:var(--accent); color:#fff; padding:9px 10px; text-align:left; font-weight:700; white-space:nowrap; }
.ref-table td { padding:7px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
.ref-table tr:nth-child(even) { background:var(--card); }

/* QUIZ */
.quiz-wrap { max-width:500px; width:100%; margin-top:20px; }
.quiz-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-size:13px; }
.quiz-head .back { background:none; color:var(--dim); font-size:13px; }
.quiz-head .stats span { margin-left:14px; }
.progress-bar { height:4px; background:var(--border); border-radius:2px; margin-bottom:32px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-l)); border-radius:2px; transition:width .5s ease; }
.q-block { text-align:center; margin-bottom:28px; animation:fadeSlide .35s ease; }
.q-label { color:var(--dim); font-size:12px; margin-bottom:6px; }
.q-text { color:var(--txt); font-size:20px; font-weight:700; line-height:1.5; word-break:keep-all; }
.choices { display:flex; flex-direction:column; gap:10px; }
.choice-btn { background:var(--card); border:1.5px solid var(--border); border-radius:12px; padding:15px 18px;
  color:var(--txt); font-size:14px; text-align:left; transition:all .2s; line-height:1.4; word-break:keep-all; }
.choice-btn:active:not(.locked) { background:var(--card-h); border-color:var(--accent); }
.choice-btn .letter { margin-right:10px; color:var(--dim); font-size:12px; }
.choice-btn.correct { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:700; animation:pop .3s ease; }
.choice-btn.wrong { background:var(--no-bg); border-color:var(--no); color:var(--no); animation:shake .35s ease; }
.choice-btn.fade { opacity:.35; }

/* RESULT */
.result-wrap { text-align:center; margin-top:15vh; }
.grade { font-size:72px; font-weight:900; margin-bottom:6px; }
.result-msg { font-size:18px; font-weight:700; }
.result-stat { color:var(--dim); font-size:14px; margin-top:8px; }
.wrong-section { max-width:500px; width:100%; margin-top:32px; text-align:left; }
.wrong-title { color:var(--no); font-size:14px; font-weight:700; margin-bottom:10px; }
.wrong-card { background:var(--card); border-radius:10px; padding:13px 16px; border:1px solid var(--border); margin-bottom:8px; }
.wrong-card .wg { color:var(--dim); font-size:11px; margin-bottom:3px; }
.wrong-card .wh { color:var(--txt); font-size:14px; font-weight:500; }
.wrong-card .wf { color:var(--accent-l); font-size:13px; margin-top:4px; }
.result-btns { display:flex; gap:10px; margin-top:32px; flex-wrap:wrap; justify-content:center; }
.btn-primary { background:var(--accent); border-radius:10px; padding:12px 26px; color:#fff; font-size:14px; font-weight:700; }
.btn-secondary { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 26px; color:var(--txt); font-size:14px; }
.btn-wrong { background:transparent; border:1px solid var(--no); border-radius:10px; padding:12px 26px; color:var(--no); font-size:14px; }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="home-logo">🧬</div>
  <h1 class="home-title">호르몬 마스터</h1>
  <p class="home-sub">내분비계 호르몬을 완벽하게 암기하자</p>
  <div class="mode-grid">
    <button class="mode-btn" onclick="startQuiz(0)">내분비샘<br>→ 호르몬</button>
    <button class="mode-btn" onclick="startQuiz(1)">호르몬<br>→ 기능</button>
    <button class="mode-btn" onclick="startQuiz(2)">호르몬<br>→ 내분비샘</button>
    <button class="mode-btn" onclick="startQuiz(3)">기능<br>→ 호르몬</button>
  </div>
  <button class="table-toggle" onclick="toggleTable()">전체 표 보기 ▼</button>
  <div id="refTable" class="ref-table" style="display:none"></div>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="quiz-wrap">
    <div class="quiz-head">
      <button class="back" onclick="goHome()">← 홈</button>
      <span id="counter"></span>
      <div class="stats">
        <span style="color:var(--ok)" id="sCorrect">✓ 0</span>
        <span style="color:var(--no)" id="sWrong">✗ 0</span>
        <span id="sStreak" style="color:var(--gold);display:none">🔥0</span>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    <div class="q-block" id="qBlock">
      <div class="q-label" id="qLabel"></div>
      <div class="q-text" id="qText"></div>
    </div>
    <div class="choices" id="choices"></div>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="result-wrap">
    <div class="grade" id="rGrade"></div>
    <div class="result-msg" id="rMsg"></div>
    <div class="result-stat" id="rStat"></div>
  </div>
  <div class="wrong-section" id="wrongSection"></div>
  <div class="result-btns" id="resultBtns"></div>
</div>

<script>
const DATA=[
  {g:"뇌하수체 전엽",h:"성장 호르몬",f:"생장 촉진"},
  {g:"뇌하수체 전엽",h:"갑상샘 자극 호르몬(TSH)",f:"티록신 분비 조절"},
  {g:"뇌하수체 전엽",h:"부신 겉질 자극 호르몬(ACTH)",f:"코르티코이드 분비 조절"},
  {g:"뇌하수체 전엽",h:"여포 자극 호르몬",f:"여포와 난자 성숙 촉진"},
  {g:"뇌하수체 전엽",h:"황체 형성 호르몬",f:"배란 및 황체 형성 촉진"},
  {g:"뇌하수체 전엽",h:"젖 분비 자극 호르몬(프로락틴)",f:"젖 분비 촉진"},
  {g:"뇌하수체 후엽",h:"옥시토신",f:"분만 시 자궁 수축 촉진"},
  {g:"뇌하수체 후엽",h:"항이뇨 호르몬(ADH)",f:"콩팥에서 수분 재흡수 촉진"},
  {g:"갑상샘",h:"티록신",f:"세포 호흡 촉진"},
  {g:"갑상샘",h:"칼시토닌",f:"혈장 Ca²⁺ 농도 감소"},
  {g:"부갑상샘",h:"파라토르몬",f:"혈장 Ca²⁺ 농도 증가"},
  {g:"부신 겉질",h:"당질 코르티코이드(코르티솔)",f:"혈당량 증가"},
  {g:"부신 겉질",h:"무기질 코르티코이드(알도스테론)",f:"콩팥에서 Na⁺ 재흡수 촉진"},
  {g:"부신 속질",h:"에피네프린(아드레날린)",f:"혈당량 증가"},
  {g:"이자 α세포",h:"글루카곤",f:"혈당량 증가"},
  {g:"이자 β세포",h:"인슐린",f:"혈당량 감소"},
  {g:"정소",h:"테스토스테론",f:"남성의 2차 성징 발현"},
  {g:"난소",h:"에스트로젠",f:"여성의 2차 성징 발현"},
  {g:"난소",h:"프로게스테론",f:"배란 억제, 임신 유지"}
];
const MODES=[
  {label:"내분비샘 → 호르몬",q:"g",a:"h"},
  {label:"호르몬 → 기능",q:"h",a:"f"},
  {label:"호르몬 → 내분비샘",q:"h",a:"g"},
  {label:"기능 → 호르몬",q:"f",a:"h"}
];
const LETTERS=["A","B","C","D"];

let mode,questions,cur,selected,score,wrongs,streak,maxStreak,tableOpen=false;

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getChoices(correct,field){
  const all=[...new Set(DATA.map(d=>d[field]))].filter(v=>v!==correct);
  return shuffle([correct,...shuffle(all).slice(0,3)]);
}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}

function goHome(){show('home')}

function toggleTable(){
  tableOpen=!tableOpen;
  const el=document.getElementById('refTable');
  const btn=document.querySelector('.table-toggle');
  if(tableOpen){
    let html='<table><tr><th>내분비샘</th><th>호르몬</th><th>기능</th></tr>';
    DATA.forEach(d=>{html+=`<tr><td>${d.g}</td><td>${d.h}</td><td>${d.f}</td></tr>`});
    html+='</table>';
    el.innerHTML=html;el.style.display='block';btn.textContent='표 숨기기 ▲';
  }else{el.style.display='none';btn.textContent='전체 표 보기 ▼';}
}

function startQuiz(mi){
  mode=MODES[mi];
  questions=shuffle(DATA).map(item=>({q:item[mode.q],a:item[mode.a],choices:getChoices(item[mode.a],mode.a),src:item}));
  cur=0;selected=false;score=0;wrongs=[];streak=0;maxStreak=0;
  show('quiz');renderQ();
}

function renderQ(){
  const q=questions[cur];
  document.getElementById('counter').textContent=`${cur+1} / ${questions.length}`;
  document.getElementById('sCorrect').textContent=`✓ ${score}`;
  document.getElementById('sWrong').textContent=`✗ ${wrongs.length}`;
  const sS=document.getElementById('sStreak');
  if(streak>=3){sS.style.display='inline';sS.textContent=`🔥${streak}`}else{sS.style.display='none'}
  const pct=((cur)/questions.length)*100;
  document.getElementById('progFill').style.width=pct+'%';
  const qb=document.getElementById('qBlock');
  qb.style.animation='none';qb.offsetHeight;qb.style.animation='fadeSlide .35s ease';
  document.getElementById('qLabel').textContent=mode.label;
  document.getElementById('qText').textContent=q.q;
  const cDiv=document.getElementById('choices');
  cDiv.innerHTML='';
  q.choices.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.innerHTML=`<span class="letter">${LETTERS[i]}</span>${c}`;
    btn.onclick=()=>pick(c,btn);
    cDiv.appendChild(btn);
  });
  selected=false;
}

function pick(choice,btn){
  if(selected)return;selected=true;
  const q=questions[cur];
  const isOk=choice===q.a;
  const allBtns=document.querySelectorAll('.choice-btn');
  allBtns.forEach(b=>{
    b.classList.add('locked');
    const txt=b.textContent.slice(1);
    if(txt===q.a) b.classList.add('correct');
    else if(b===btn&&!isOk) b.classList.add('wrong');
    else b.classList.add('fade');
  });
  if(isOk){score++;streak++;if(streak>maxStreak)maxStreak=streak}
  else{streak=0;wrongs.push(q)}
  document.getElementById('sCorrect').textContent=`✓ ${score}`;
  document.getElementById('sWrong').textContent=`✗ ${wrongs.length}`;
  const sS=document.getElementById('sStreak');
  if(streak>=3){sS.style.display='inline';sS.textContent=`🔥${streak}`}else{sS.style.display='none'}
  const pct=((cur+1)/questions.length)*100;
  document.getElementById('progFill').style.width=pct+'%';
  setTimeout(()=>{
    if(cur<questions.length-1){cur++;renderQ()}else{showResult()}
  },1000);
}

function showResult(){
  show('result');
  const pct=Math.round(score/questions.length*100);
  const gr=pct>=95?'S':pct>=85?'A':pct>=70?'B':pct>=50?'C':'D';
  const gc={S:'var(--gold)',A:'var(--ok)',B:'var(--accent-l)',C:'var(--silver)',D:'var(--no)'}[gr];
  const msg=pct===100?'완벽해요! 🎉':pct>=85?'훌륭해요! 💪':pct>=70?'좋아요, 조금만 더! 📚':'다시 복습해봐요 🔄';
  document.getElementById('rGrade').style.color=gc;
  document.getElementById('rGrade').textContent=gr;
  document.getElementById('rMsg').textContent=msg;
  document.getElementById('rStat').textContent=`${score} / ${questions.length} (${pct}%) · 최대 연속 ${maxStreak}개`;
  const ws=document.getElementById('wrongSection');
  if(wrongs.length){
    let html='<div class="wrong-title">틀린 문제 복습</div>';
    wrongs.forEach(w=>{
      html+=`<div class="wrong-card"><div class="wg">${w.src.g}</div><div class="wh">${w.src.h}</div><div class="wf">→ ${w.src.f}</div></div>`;
    });
    ws.innerHTML=html;ws.style.display='block';
  }else{ws.style.display='none'}
  let btns=`<button class="btn-primary" onclick="startQuiz(${MODES.indexOf(mode)})">다시 도전</button>`;
  btns+=`<button class="btn-secondary" onclick="goHome()">홈으로</button>`;
  if(wrongs.length)btns+=`<button class="btn-wrong" onclick="retryWrong()">오답만 풀기</button>`;
  document.getElementById('resultBtns').innerHTML=btns;
}

function retryWrong(){
  const ws=[...wrongs];
  questions=shuffle(ws).map(w=>({q:w.src[mode.q],a:w.src[mode.a],choices:getChoices(w.src[mode.a],mode.a),src:w.src}));
  cur=0;selected=false;score=0;wrongs=[];streak=0;maxStreak=0;
  show('quiz');renderQ();
}
</script>
</body>
</html>
