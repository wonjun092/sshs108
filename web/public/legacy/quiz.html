<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원소 주기율표 암기 프로그램</title>
<style>
  /* 🍔 햄버거 사이드바 스타일 */
  .sidenav {
      height: 100%; width: 0; position: fixed; z-index: 100; top: 0; left: 0;
      background-color: #111; overflow-x: hidden; transition: 0.3s; padding-top: 60px;
  }
  .sidenav a {
      padding: 10px 10px 10px 30px; text-decoration: none; font-size: 18px;
      color: #818181; display: block; transition: 0.3s;
  }
  .sidenav a:hover { color: #f1f1f1; }
  .sidenav .closebtn { position: absolute; top: 0; right: 20px; font-size: 36px; margin-left: 50px; }

  /* 💡 퀴즈 화면은 배경이 밝으니 햄버거 버튼 색상을 검은색(#333)으로 설정! */
  .hamburger { font-size: 24px; cursor: pointer; color: #333; margin-right: 15px; }

  :root {
    --bg: #f5f5f0;
    --card: #ffffff;
    --border: #e0deda;
    --border2: #c8c5c0;
    --text: #1a1a18;
    --text2: #666660;
    --text3: #999993;
    --green-bg: #eaf3de;
    --green-text: #3B6D11;
    --green-border: #97c459;
    --red-bg: #fcebeb;
    --red-text: #A32D2D;
    --red-border: #f09595;
    --radius: 10px;
    --radius-sm: 7px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .app { max-width: 660px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; }

  /* ── Settings panel ── */
  .settings { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
  .settings-title { font-size: 11px; font-weight: 600; color: var(--text3); margin-bottom: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .setting-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .setting-row:last-child { margin-bottom: 0; }
  .setting-label { font-size: 13px; color: var(--text2); min-width: 72px; padding-top: 5px; flex-shrink: 0; }
  .pill-group { display: flex; flex-wrap: wrap; gap: 5px; }
  .pill { padding: 4px 12px; font-size: 12px; border: 1px solid var(--border2); border-radius: 20px; background: var(--card); color: var(--text2); cursor: pointer; transition: all .12s; white-space: nowrap; }
  .pill:hover { background: var(--bg); }
  .pill.on { background: var(--text); color: #fff; border-color: var(--text); }

  /* range grid */
  .range-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
  .range-item { padding: 8px 10px; font-size: 12px; border: 1px solid var(--border2); border-radius: var(--radius-sm); background: var(--card); color: var(--text2); cursor: pointer; transition: all .12s; text-align: left; line-height: 1.4; }
  .range-item:hover { background: var(--bg); }
  .range-item.on { background: var(--text); color: #fff; border-color: var(--text); }
  .range-item .r-title { font-weight: 600; display: block; font-size: 13px; }
  .range-item .r-sub { font-size: 11px; opacity: .65; display: block; margin-top: 2px; }

  .divider { height: 1px; background: var(--border); margin: 14px 0; }

  /* ── Stats ── */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; }
  .stat .num { font-size: 22px; font-weight: 600; display: block; }
  .stat .lbl { font-size: 11px; color: var(--text3); margin-top: 2px; display: block; }
  .stat.streak .num { color: #854F0B; }

  /* ── Progress ── */
  .progress-wrap { background: var(--border); border-radius: 3px; height: 5px; margin-bottom: 20px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--text); border-radius: 3px; transition: width .3s; }

  /* ── Question card ── */
  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 20px 22px; text-align: center; margin-bottom: 16px; }
  .q-label { font-size: 11px; color: var(--text3); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 12px; }
  .q-big { font-size: 64px; font-weight: 600; line-height: 1; margin-bottom: 6px; }
  .q-big.md { font-size: 36px; margin-top: 8px; }
  .q-big.sm { font-size: 24px; margin-top: 8px; }
  .q-small { font-size: 14px; color: var(--text2); margin-bottom: 8px; }
  .cat-tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; margin-top: 6px; }

  /* ── Inputs ── */
  .input-area { margin-bottom: 10px; }
  .input-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .input-row label { font-size: 13px; color: var(--text2); min-width: 36px; }
  input[type=text], input[type=number] {
    flex: 1; height: 44px; padding: 0 14px; font-size: 15px;
    border: 1px solid var(--border2); border-radius: var(--radius-sm);
    background: var(--card); color: var(--text); outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: #888; }
  input.ok { border-color: var(--green-border); background: var(--green-bg); }
  input.ng { border-color: var(--red-border); background: var(--red-bg); }
  .hint-text { font-size: 11px; color: var(--text3); text-align: center; margin-bottom: 8px; }

  /* ── Buttons ── */
  .btn-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .btn { flex: 1; height: 44px; border: 1px solid var(--border2); border-radius: var(--radius-sm); background: var(--card); color: var(--text); font-size: 14px; cursor: pointer; transition: background .12s; }
  .btn:hover:not(:disabled) { background: var(--bg); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .btn.primary:hover:not(:disabled) { opacity: .85; }

  /* ── Feedback ── */
  .fb { min-height: 22px; text-align: center; font-size: 13px; margin-bottom: 8px; color: var(--text3); }
  .fb.ok { color: var(--green-text); font-weight: 600; }
  .fb.ng { color: var(--red-text); font-weight: 500; }

  /* ── Multiple choice ── */
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .opt-btn {
    border: 1px solid var(--border2); border-radius: var(--radius-sm);
    padding: 12px 10px; font-size: 14px; cursor: pointer; background: var(--card);
    color: var(--text); text-align: left; line-height: 1.4; transition: background .1s;
  }
  .opt-btn:hover:not(:disabled) { background: var(--bg); }
  .opt-btn.ok { background: var(--green-bg); border-color: var(--green-border); color: var(--green-text); font-weight: 500; }
  .opt-btn.ng { background: var(--red-bg); border-color: var(--red-border); color: var(--red-text); }
  .opt-btn:disabled { cursor: default; }

  /* ── Result ── */
  .result { text-align: center; padding: 32px 16px; }
  .result .score { font-size: 56px; font-weight: 600; }
  .result .grade { font-size: 18px; color: var(--text2); margin: 8px 0 24px; }
  .result-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .result-btns .btn { flex: none; padding: 0 24px; }
  .wrong-section { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px; text-align: left; }
  .wrong-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text2); }
  .wrong-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .wrong-table th { text-align: left; padding: 6px 8px; font-size: 11px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); }
  .wrong-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
  .wrong-table tr:last-child td { border-bottom: none; }
  .sym-cell { font-weight: 600; }

  /* =========================================
   📌 사이드바 드롭다운(아코디언) 메뉴 스타일
   ========================================= */

    .dropdown-btn {
        padding: 10px 10px 10px 30px;
        text-decoration: none;
        font-size: 18px;
        color: #818181;
        display: block;
        border: none;
        background: none;
        width: 100%;
        text-align: left;
        cursor: pointer;
        outline: none;
        transition: 0.3s;
    }

    /* 마우스 올렸을 때 색상 변화 */
    .dropdown-btn:hover, .dropdown-btn.active {
        color: #f1f1f1;
    }

    /* 펼쳐지는 컨테이너 (처음엔 숨겨둠) */
    .dropdown-container {
        display: none;
        background-color: #262626;
        padding-left: 15px;
    }
</style>

const RANGES = {
  "all":      e => true,
  "1-2":      e => e.n <= 2,
  "3-10":     e => e.n >= 3  && e.n <= 10,
  "11-18":    e => e.n >= 11 && e.n <= 18,
  "19-36":    e => e.n >= 19 && e.n <= 36,
  "37-54":    e => e.n >= 37 && e.n <= 54,
  "55-86":    e => e.n >= 55 && e.n <= 86,
  "87-118":   e => e.n >= 87,
  "57-71":    e => e.n >= 57 && e.n <= 71,
  "89-103":   e => e.n >= 89 && e.n <= 103,
  "1-20":     e => e.n <= 20,
  "1-36":     e => e.n <= 36,
  "1-54":     e => e.n <= 54,
  "alkali":   e => e.cat === "알칼리금속",
  "alkaline": e => e.cat === "알칼리토금속",
  "trans":    e => e.cat === "전이금속",
  "halogen":  e => e.cat === "할로젠",
  "noble":    e => e.cat === "비활성기체",
  "semimetal":e => e.cat === "준금속",
  "wrong":    null
};

let mode = 'num2name', inputMode = 'type', orderMode = 'random', rangeKey = 'all';
let pool = [], idx = 0, cor = 0, wrn = 0, streak = 0;
let answered = false, wrongList = [], curSubMode = '';

function shuffle(a) { return [...a].sort(() => Math.random() - .5); }

function getBasePool() {
  if (rangeKey === 'wrong') return wrongList.length > 0 ? [...wrongList] : [...EL];
  const fn = RANGES[rangeKey];
  return fn ? EL.filter(fn) : [...EL];
}

function getPool() {
  const base = getBasePool();
  return orderMode === 'random' ? shuffle(base) : [...base].sort((a,b) => a.n - b.n);
}

function setMode(m) {
  mode = m;
  ['num2name','num2sym','num2both','sym2num','name2num','mix'].forEach(k => {
    document.getElementById('m-'+k).classList.toggle('on', k === m);
  });
  restart();
}

function setInput(v) {
  inputMode = v;
  document.getElementById('t-type').classList.toggle('on', v === 'type');
  document.getElementById('t-mc').classList.toggle('on', v === 'mc');
  restart();
}

function setOrder(v) {
  orderMode = v;
  document.getElementById('t-rand').classList.toggle('on', v === 'random');
  document.getElementById('t-seq').classList.toggle('on', v === 'seq');
  restart();
}

function setRange(btn) {
  rangeKey = btn.dataset.range;
  document.querySelectorAll('.range-item').forEach(b => b.classList.toggle('on', b === btn));
  restart();
}

function restart() {
  pool = getPool();
  idx = 0; cor = 0; wrn = 0; streak = 0;
  wrongList = [];
  updateStats();
  nextQ();
}

function retryWrong() {
  if (wrongList.length === 0) { restart(); return; }
  pool = orderMode === 'random' ? shuffle([...wrongList]) : [...wrongList].sort((a,b) => a.n - b.n);
  idx = 0; cor = 0; wrn = 0; streak = 0;
  updateStats();
  nextQ();
}

function updateStats() {
  document.getElementById('s-cor').textContent = cor;
  document.getElementById('s-wrn').textContent = wrn;
  document.getElementById('s-prog').textContent = idx + '/' + pool.length;
  document.getElementById('s-streak').textContent = streak;
  document.getElementById('pbar').style.width = pool.length ? Math.round(idx / pool.length * 100) + '%' : '0%';
}

function pickSubMode() {
  if (mode === 'mix') {
    const opts = ['num2name','num2sym','sym2num','name2num'];
    return opts[Math.floor(Math.random() * opts.length)];
  }
  return mode;
}

function catTag(el) {
  return `<span class="cat-tag" style="${CAT_STYLE[el.cat]||''}">${el.cat}</span>`;
}

function makeMCOpts(el, sub) {
  const base = getBasePool().filter(e => e.n !== el.n);
  const fallback = EL.filter(e => e.n !== el.n);
  const distPool = base.length >= 3 ? base : fallback;
  const all = shuffle([el, ...shuffle(distPool).slice(0,3)]);

  return all.map(e => {
    let label = '';
    if (sub === 'num2name')      label = e.kr;
    else if (sub === 'num2sym')  label = e.s;
    else if (sub === 'num2both') label = `<strong>${e.s}</strong>&nbsp; ${e.kr}`;
    else                         label = e.n + '번';
    return `<button class="opt-btn" data-n="${e.n}" onclick="pickMC(this,${e.n})">${label}</button>`;
  }).join('');
}

function nextQ() {
  if (idx >= pool.length) { showResult(); return; }
  answered = false;
  const el = pool[idx];
  curSubMode = pickSubMode();
  const useMC = inputMode === 'mc';

  let qContent = '';
  if (curSubMode === 'num2name') {
    qContent = `<div class="q-label">원자번호 → 원소 이름</div><div class="q-big">${el.n}</div>${catTag(el)}`;
  } else if (curSubMode === 'num2sym') {
    qContent = `<div class="q-label">원자번호 → 원소 기호</div><div class="q-big">${el.n}</div>${catTag(el)}`;
  } else if (curSubMode === 'num2both') {
    qContent = `<div class="q-label">원자번호 → 기호 + 이름</div><div class="q-big">${el.n}</div>${catTag(el)}`;
  } else if (curSubMode === 'sym2num') {
    qContent = `<div class="q-label">원소 기호 → 원자번호</div><div class="q-big">${el.s}</div><div class="q-small">${el.kr}</div>${catTag(el)}`;
  } else {
    qContent = `<div class="q-label">원소 이름 → 원자번호</div><div class="q-big ${el.kr.length > 5 ? 'sm' : 'md'}">${el.kr}</div>${catTag(el)}`;
  }

  let ansContent = '';
  if (useMC) {
    ansContent = `<div class="opts">${makeMCOpts(el, curSubMode)}</div>
      <div class="fb" id="fb"></div>
      <button class="btn" id="nb" onclick="nextQ()" style="display:none">다음 문제 →</button>`;
  } else if (curSubMode === 'num2both') {
    ansContent = `<div class="input-area">
        <div class="input-row"><label>기호</label><input type="text" id="inp-s" placeholder="예: Na" autocomplete="off"/></div>
        <div class="input-row"><label>이름</label><input type="text" id="inp-k" placeholder="예: 나트륨" autocomplete="off"/></div>
      </div>
      <div class="hint-text">Tab으로 다음 칸 · Enter로 확인</div>
      <div class="fb" id="fb"></div>
      <div class="btn-row">
        <button class="btn primary" id="sbtn" onclick="checkTyped()">확인</button>
        <button class="btn" onclick="skipQ()">모르겠어요</button>
      </div>
      <button class="btn" id="nb" onclick="nextQ()" style="display:none">다음 문제 →</button>`;
  } else if (curSubMode === 'num2name') {
    ansContent = `<div class="input-area">
        <div class="input-row"><label>이름</label><input type="text" id="inp-k" placeholder="예: 나트륨" autocomplete="off"/></div>
      </div>
      <div class="hint-text">Enter로 확인</div>
      <div class="fb" id="fb"></div>
      <div class="btn-row">
        <button class="btn primary" id="sbtn" onclick="checkTyped()">확인</button>
        <button class="btn" onclick="skipQ()">모르겠어요</button>
      </div>
      <button class="btn" id="nb" onclick="nextQ()" style="display:none">다음 문제 →</button>`;
  } else if (curSubMode === 'num2sym') {
    ansContent = `<div class="input-area">
        <div class="input-row"><label>기호</label><input type="text" id="inp-s" placeholder="예: Na" autocomplete="off"/></div>
      </div>
      <div class="hint-text">Enter로 확인</div>
      <div class="fb" id="fb"></div>
      <div class="btn-row">
        <button class="btn primary" id="sbtn" onclick="checkTyped()">확인</button>
        <button class="btn" onclick="skipQ()">모르겠어요</button>
      </div>
      <button class="btn" id="nb" onclick="nextQ()" style="display:none">다음 문제 →</button>`;
  } else {
    ansContent = `<div class="input-area">
        <div class="input-row"><label>번호</label><input type="number" id="inp-n" placeholder="1 ~ 118" min="1" max="118" autocomplete="off"/></div>
      </div>
      <div class="hint-text">Enter로 확인</div>
      <div class="fb" id="fb"></div>
      <div class="btn-row">
        <button class="btn primary" id="sbtn" onclick="checkTyped()">확인</button>
        <button class="btn" onclick="skipQ()">모르겠어요</button>
      </div>
      <button class="btn" id="nb" onclick="nextQ()" style="display:none">다음 문제 →</button>`;
  }

  document.getElementById('qa').innerHTML = `<div class="q-card">${qContent}</div>${ansContent}`;

  setTimeout(() => {
    const first = document.getElementById('inp-s') || document.getElementById('inp-k') || document.getElementById('inp-n');
    if (first) first.focus();
    const inpS = document.getElementById('inp-s');
    const inpK = document.getElementById('inp-k');
    const inpN = document.getElementById('inp-n');
    if (inpS && inpK) {
      inpS.addEventListener('keydown', e => { if (e.key==='Tab'){e.preventDefault();inpK.focus();} if(e.key==='Enter')checkTyped(); });
      inpK.addEventListener('keydown', e => { if(e.key==='Enter')checkTyped(); });
    } else if (inpS) {
      inpS.addEventListener('keydown', e => { if(e.key==='Enter')checkTyped(); });
    } else if (inpK) {
      inpK.addEventListener('keydown', e => { if(e.key==='Enter')checkTyped(); });
    } else if (inpN) {
      inpN.addEventListener('keydown', e => { if(e.key==='Enter')checkTyped(); });
    }
  }, 30);
}

function checkTyped() {
  if (answered) return;
  const el = pool[idx];
  let ok = false;
  if (curSubMode === 'num2both') {
    const sv = (document.getElementById('inp-s').value||'').trim();
    const kv = (document.getElementById('inp-k').value||'').trim();
    const sOk = sv.toLowerCase() === el.s.toLowerCase();
    const kOk = kv === el.kr;
    ok = sOk && kOk;
    document.getElementById('inp-s').classList.add(sOk?'ok':'ng');
    document.getElementById('inp-k').classList.add(kOk?'ok':'ng');
    if (!ok) showFb(false, `정답: ${el.s} / ${el.kr}`);
    else showFb(true);
  } else if (curSubMode === 'num2name') {
    const kv = (document.getElementById('inp-k').value||'').trim();
    ok = kv === el.kr;
    document.getElementById('inp-k').classList.add(ok?'ok':'ng');
    if (!ok) showFb(false, `정답: ${el.kr} (${el.s})`);
    else showFb(true);
  } else if (curSubMode === 'num2sym') {
    const sv = (document.getElementById('inp-s').value||'').trim();
    ok = sv.toLowerCase() === el.s.toLowerCase();
    document.getElementById('inp-s').classList.add(ok?'ok':'ng');
    if (!ok) showFb(false, `정답: ${el.s} (${el.kr})`);
    else showFb(true);
  } else {
    const nv = parseInt(document.getElementById('inp-n').value);
    ok = nv === el.n;
    document.getElementById('inp-n').classList.add(ok?'ok':'ng');
    if (!ok) showFb(false, `정답: ${el.n}번 (${el.s} / ${el.kr})`);
    else showFb(true);
  }
  finalize(ok, el);
}

function pickMC(btn, n) {
  if (answered) return;
  const el = pool[idx];
  const ok = n === el.n;
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (parseInt(b.dataset.n) === el.n) b.classList.add('ok');
  });
  if (!ok) { btn.classList.add('ng'); showFb(false, `정답: ${el.n}번 (${el.s} / ${el.kr})`); }
  else showFb(true);
  finalize(ok, el);
}

function skipQ() {
  if (answered) return;
  const el = pool[idx];
  showFb(false, `정답: ${el.n}번 (${el.s} / ${el.kr})`);
  ['inp-s','inp-k','inp-n'].forEach(id => { const i=document.getElementById(id); if(i)i.classList.add('ng'); });
  finalize(false, el);
}

function showFb(ok, msg) {
  const fb = document.getElementById('fb');
  if (!fb) return;
  fb.textContent = ok ? '정답!' : '오답 — ' + (msg||'');
  fb.className = 'fb ' + (ok ? 'ok' : 'ng');
}

function finalize(ok, el) {
  answered = true; idx++;
  if (ok) { cor++; streak++; }
  else { wrn++; streak = 0; if (!wrongList.find(e=>e.n===el.n)) wrongList.push(el); }
  const sbtn = document.getElementById('sbtn');
  if (sbtn) sbtn.disabled = true;
  updateStats();
  const nb = document.getElementById('nb');
  if (nb) { nb.style.display='block'; setTimeout(()=>nb.focus(),30); }
}

function showResult() {
  const total = cor + wrn;
  const pct = total > 0 ? Math.round(cor/total*100) : 0;
  const grade = pct===100 ? '완벽해요! 전체 마스터!' :
                pct>=90  ? '훌륭해요!' :
                pct>=70  ? '잘했어요!' :
                pct>=50  ? '절반 이상 맞혔어요!' : '더 연습해봐요!';
  let wrongHtml = '';
  if (wrongList.length > 0) {
    const rows = wrongList.map(e=>`<tr>
      <td>${e.n}</td><td class="sym-cell">${e.s}</td><td>${e.kr}</td>
      <td><span class="cat-tag" style="${CAT_STYLE[e.cat]||''};font-size:11px">${e.cat}</span></td>
    </tr>`).join('');
    wrongHtml = `<div class="wrong-section"><h3>틀린 원소 (${wrongList.length}개)</h3>
      <table class="wrong-table">
        <thead><tr><th>번호</th><th>기호</th><th>이름</th><th>분류</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }
  document.getElementById('qa').innerHTML = `<div class="result">
    <div class="score">${cor}/${total}</div>
    <div class="grade">${pct}점 — ${grade}</div>
    <div class="result-btns">
      <button class="btn" onclick="restart()">처음부터 다시</button>
      ${wrongList.length>0?`<button class="btn primary" onclick="retryWrong()">틀린 것만 다시</button>`:''}
    </div>
    ${wrongHtml}
  </div>`;
  document.getElementById('pbar').style.width = '100%';
}

restart();

function openNav() { document.getElementById("mySidenav").style.width = "250px"; }
function closeNav() { document.getElementById("mySidenav").style.width = "0"; }

<script>
    function openNav() { document.getElementById("mySidenav").style.width = "250px"; }
    function closeNav() { document.getElementById("mySidenav").style.width = "0"; }

    // 드롭다운 스크립트
    var dropdown = document.getElementsByClassName("dropdown-btn");
    var i;
    for (i = 0; i < dropdown.length; i++) {
      dropdown[i].addEventListener("click", function() {
        this.classList.toggle("active");
        var dropdownContent = this.nextElementSibling;
        if (dropdownContent.style.display === "block") {
          dropdownContent.style.display = "none";
        } else {
          dropdownContent.style.display = "block";
        }
      });
    }
</script>
</body>
</html>
